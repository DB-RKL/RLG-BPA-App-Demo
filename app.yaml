command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: SERVING_ENDPOINT
    value: databricks-claude-sonnet-4-5
  - name: DATABRICKS_WAREHOUSE_ID
    value: "ced20c73f16a2915"
  - name: BPA_CATALOG
    value: "serverless_stable_wx20co_catalog"
  - name: BPA_SCHEMA
    value: "bpa_rubjit"
  - name: BPA_VOLUME
    value: "documents"
  # Lakeview dashboard and Genie space are provisioned during deployment;
  # their URLs/IDs are filled in below once created (see scripts/deploy_dashboard.py
  # and the Genie space setup). Power BI stays unset and degrades gracefully
  # to a "not configured" placeholder.
  - name: DATABRICKS_DASHBOARD_URL
    value: "https://fevm-serverless-stable-wx20co.cloud.databricks.com/embed/dashboardsv3/01f1b72a2a1d100fb06e1284b208e373"
  - name: DATABRICKS_GENIE_SPACE_ID
    value: "01f1b729d86f1055b77bac0c71294adc"

resources:
  - name: database
    database:
      instance_name: rlg-lakebase
      database_name: databricks_postgres
      permission: CAN_CONNECT_AND_CREATE
  - name: serving-endpoint
    serving_endpoint:
      name: databricks-claude-sonnet-4-5
      permission: CAN_QUERY
