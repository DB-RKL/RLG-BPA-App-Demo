command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: SERVING_ENDPOINT
    value: databricks-claude-sonnet-4-5
  - name: DATABRICKS_WAREHOUSE_ID
    value: "c28b7d217c320d9a"
  - name: BPA_CATALOG
    value: "serverless_stable_n047pw_catalog"
  - name: BPA_SCHEMA
    value: "bpa_rubjit"
  - name: BPA_VOLUME
    value: "documents"
  # Lakeview dashboard / Genie space / Power BI URLs were provisioned on the
  # original demo workspace and are not present in this FE-VM. Leaving the
  # vars unset makes the BI tabs degrade gracefully (the app shows a "not
  # configured" placeholder instead of an empty iframe).

resources:
  - name: database
    database:
      instance_name: bpa-lakebase
      database_name: databricks_postgres
      permission: CAN_CONNECT_AND_CREATE
  - name: serving-endpoint
    serving_endpoint:
      name: databricks-claude-sonnet-4-5
      permission: CAN_QUERY
